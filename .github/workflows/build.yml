name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create project files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {"name":"sohel-pro","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/core":"^6.1.2","@capacitor/android":"^6.1.2","@capacitor/filesystem":"^6.0.1","@capacitor/share":"^6.0.2"},
           "devDependencies":{"@capacitor/cli":"^6.1.2"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.sohelpro.ngoapp","appName":"Sohel Pro","webDir":"www"}
          EOF
      - run: npm install
      - run: npx cap add android
      - name: App icons and splash (from icon.png only)
        run: |
          test -f icon.png || (echo "icon.png নেই — repo-তে icon.png তুলুন" && exit 1)
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, glob
          res = 'android/app/src/main/res'
          logo = Image.open('icon.png').convert('RGBA')
          logo = logo.crop(logo.getbbox())
          def box(px, frac):
              inner = round(px * frac)
              r = inner / max(logo.size)
              im = logo.resize((max(1, round(logo.width * r)), max(1, round(logo.height * r))), Image.LANCZOS)
              c = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              c.alpha_composite(im, ((px - im.width) // 2, (px - im.height) // 2))
              return c
          for d, px in (('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)):
              folder = os.path.join(res, 'mipmap-' + d)
              os.makedirs(folder, exist_ok=True)
              for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  box(px, 1.0).save(os.path.join(folder, n))
          for f in glob.glob(os.path.join(res, 'mipmap-anydpi*', '*.xml')):
              os.remove(f)
          os.makedirs(os.path.join(res, 'drawable'), exist_ok=True)
          box(1024, 0.64).save(os.path.join(res, 'drawable', 'splash_icon.png'))
          os.makedirs(os.path.join(res, 'values-v31'), exist_ok=True)
          open(os.path.join(res, 'values-v31', 'styles.xml'), 'w').write(
          '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
          '  <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n'
          '    <item name="android:windowSplashScreenBackground">#FFFFFF</item>\n'
          '    <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>\n'
          '  </style>\n</resources>\n')
          print('icons and splash written')
          PY
      - run: npx cap sync android
      - name: Storage permission for old Android
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application#' $f
      - name: Use fixed signing key (optional, keeps updates installable)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed keystore"
          else
            echo "No DEBUG_KEYSTORE_B64 secret: a new random key will be used"
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SohelPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
